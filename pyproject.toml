[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "germany-decoded"
version = "0.1.0"
description = "AI-powered legal information assistant for Germany"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "lxml>=6.1.1",
    "python-dotenv>=1.2.2",
    "requests>=2.34.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
